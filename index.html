<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de Correos Profesionales con IA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-6 flex flex-col items-center justify-center">

  <main class="max-w-xl w-full bg-white p-6 rounded-xl shadow-md border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Asistente de Correos IA</h1>
    <p class="text-sm text-slate-600 mb-4">Escribe un borrador rápido e informal para que la IA lo transforme en un mensaje profesional.</p>

    <label class="block font-semibold text-slate-700 mb-2">Tu borrador o idea:</label>
    <textarea id="userInput" rows="3" class="w-full p-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4" placeholder="Ej: Dile a mi cliente que el informe se retrasará 2 días porque estamos revisando los datos."></textarea>

    <button onclick="generarConIA()" id="btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition">
      Redactar Correo Profesional
    </button>

    <div class="mt-6">
      <label class="block font-semibold text-slate-700 mb-2">Resultado generado por Gemini IA:</label>
      <div id="output" class="p-4 bg-slate-50 border border-slate-200 rounded-lg min-h-[120px] text-slate-700 text-sm whitespace-pre-line">
        El resultado redactado aparecerá aquí...
      </div>
    </div>
  </main>

  <script>
    async function generarConIA() {
      const input = document.getElementById('userInput').value.trim();
      const output = document.getElementById('output');
      const btn = document.getElementById('btn');

      if (!input) {
        alert('Por favor, escribe un borrador antes de presionar el botón.');
        return;
      }

      // 1. PEGA AQUÍ TU API KEY GENERADA EN GOOGLE AI STUDIO
      const API_KEY = "AQ.Ab8RN6LkHIujTR6a8kobl3EN7SpLek214YGCz_4QiR8XN8rwUQ"; 

      if (API_KEY === "PEGA_AQUI_TU_API_KEY" || !API_KEY) {
        alert("Por favor, pon tu clave API dentro de las comillas en el código.");
        return;
      }

      // Endpoint oficial con el modelo gemini-3.6-flash
      const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`;

      btn.innerText = 'Consultando a la IA...';
      btn.disabled = true;
      output.innerText = 'Redactando versión profesional...';

      const promptText = `Actúa como un experto en comunicación corporativa. Transforma el siguiente texto o idea informal en un correo electrónico profesional, diplomático y asertivo en español. Incluye una línea de asunto sugerida al inicio:\n\nIdea del usuario: "${input}"`;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: promptText }]
            }]
          })
        });

        const data = await response.json();

        if (data.error) {
          console.error('Error API:', data.error);
          output.innerText = `Error (${data.error.code}): ${data.error.message}`;
          return;
        }

        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
          output.innerText = data.candidates[0].content.parts[0].text;
        } else {
          output.innerText = 'No se pudo generar la respuesta.';
        }
      } catch (error) {
        console.error('Error de red:', error);
        output.innerText = 'Error de conexión al procesar la solicitud.';
      } finally {
        btn.innerText = 'Redactar Correo Profesional';
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
