<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Correos Profesionales - Prueba</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-6 flex flex-col items-center justify-center">

  <main class="max-w-xl w-full bg-white p-6 rounded-xl shadow-md border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Asistente de Correos IA</h1>
    <p class="text-sm text-slate-600 mb-4">Escribe un borrador rápido e informal para convertirlo en un mensaje profesional.</p>

    <label class="block font-semibold text-slate-700 mb-2">Tu borrador:</label>
    <textarea id="userInput" rows="3" class="w-full p-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4" placeholder="Ej: Dile a mi jefe que no podré ir hoy porque me siento mal."></textarea>

    <button onclick="simularIA()" id="btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition">
      Transformar Correo
    </button>

    <div class="mt-6">
      <label class="block font-semibold text-slate-700 mb-2">Resultado Profesional:</label>
      <div id="output" class="p-4 bg-slate-50 border border-slate-200 rounded-lg min-h-[100px] text-slate-700 text-sm">
        El resultado aparecerá aquí...
      </div>
    </div>
  </main>

  <script>
    function simularIA() {
      const input = document.getElementById('userInput').value;
      const output = document.getElementById('output');
      const btn = document.getElementById('btn');

      if (!input.trim()) {
        alert('Por favor, escribe algo primero.');
        return;
      }

      btn.innerText = 'Procesando...';
      
      // Simulador de respuesta en lo que conectamos la API real
      setTimeout(() => {
        output.innerHTML = `<strong>Asunto:</strong> Notificación de ausencia por motivos de salud<br><br>Estimado/a,<br><br>Le escribo para informarle que el día de hoy no me será posible asistí a la jornada laboral debido a un problema de salud. Mantendré el seguimiento de mis pendientes en cuanto sea posible.<br><br>Agradezco su comprensión.<br><br>Saludos cordiales.`;
        btn.innerText = 'Transformar Correo';
      }, 1000);
    }
  </script>

</body>
</html>
